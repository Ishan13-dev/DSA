name: Compile DSA Solutions

on:
  push:
    paths:
      - "practice/solutions/**"
      - ".github/workflows/compile-solutions.yml"
  pull_request:
    paths:
      - "practice/solutions/**"
      - ".github/workflows/compile-solutions.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compilers
        run: sudo apt-get update && sudo apt-get install -y gcc g++

      - name: Compile all C solutions
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/dsa-build/c
          count=0
          while IFS= read -r file; do
            name=$(basename "$file" .c)
            gcc -std=c11 -Wall -Wextra "$file" -o "/tmp/dsa-build/c/$name"
            count=$((count + 1))
          done < <(find practice/solutions/c -type f -name '*.c' | sort)
          echo "Compiled $count C files successfully."

      - name: Compile all C++ solutions
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/dsa-build/cpp
          count=0
          while IFS= read -r file; do
            name=$(basename "$file" .cpp)
            g++ -std=c++17 -Wall -Wextra "$file" -o "/tmp/dsa-build/cpp/$name"
            count=$((count + 1))
          done < <(find practice/solutions/cpp -type f -name '*.cpp' | sort)
          echo "Compiled $count C++ files successfully."

      - name: Smoke-test integer edge cases (C and C++)
        shell: bash
        run: |
          set -e
          test_case() {
            program="$1"
            input="$2"
            expected="$3"
            actual=$(printf '%s' "$input" | "$program")
            if [ "$actual" != "$expected" ]; then
              echo "FAILED: $program input [$input]"
              echo "Expected: $expected"
              echo "Actual:   $actual"
              exit 1
            fi
          }
          for language in c cpp; do
            extension=c
            compiler=gcc
            standard=c11
            if [ "$language" = cpp ]; then
              extension=cpp
              compiler=g++
              standard=c++17
            fi
            base="practice/solutions/$language"
            "$compiler" -std="$standard" "$base/12-gcd-two-numbers.$extension" -o /tmp/gcd
            "$compiler" -std="$standard" "$base/13-lcm-two-numbers.$extension" -o /tmp/lcm
            "$compiler" -std="$standard" "$base/14-count-digits.$extension" -o /tmp/count-digits
            "$compiler" -std="$standard" "$base/15-sum-digits.$extension" -o /tmp/sum-digits
            test_case /tmp/gcd "-2147483648 0\n" "GCD = 2147483648"
            test_case /tmp/gcd "-12 18\n" "GCD = 6"
            test_case /tmp/lcm "0 -18\n" "LCM = 0"
            test_case /tmp/lcm "12 18\n" "LCM = 36"
            test_case /tmp/count-digits "-2147483648\n" "Digit count = 10"
            test_case /tmp/count-digits "0\n" "Digit count = 1"
            test_case /tmp/sum-digits "-2147483648\n" "Digit sum = 47"
            test_case /tmp/sum-digits "0\n" "Digit sum = 0"
          done
          echo "Integer edge-case smoke tests passed for both languages."

      - name: Smoke-test array overflow edge cases (C and C++)
        shell: bash
        run: |
          set -e
          for language in c cpp; do
            extension=c
            compiler=gcc
            standard=c11
            if [ "$language" = cpp ]; then
              extension=cpp
              compiler=g++
              standard=c++17
            fi
            base="practice/solutions/$language"
            "$compiler" -std="$standard" "$base/27-sum-array-elements.$extension" -o /tmp/array-sum
            "$compiler" -std="$standard" "$base/39-max-min-difference.$extension" -o /tmp/max-min-diff
            "$compiler" -std="$standard" "$base/40-pair-given-sum.$extension" -o /tmp/pair-sum
            sum=$(printf '2\n2147483647 -2147483648\n' | /tmp/array-sum)
            diff=$(printf '2\n2147483647 -2147483648\n' | /tmp/max-min-diff)
            pair=$(printf '4\n2 7 11 15\n9\n' | /tmp/pair-sum)
            overflow_pair=$(printf '2\n2147483647 1\n2147483647\n' | /tmp/pair-sum)
            [ "$sum" = "-1" ]
            [ "$diff" = "Difference = 4294967295" ]
            [ "$pair" = "2 7" ]
            [ "$overflow_pair" = "No pair found" ]
          done
          echo "Array overflow edge-case smoke tests passed for both languages."

      - name: Smoke-test numeric limits (C and C++)
        shell: bash
        run: |
          set -e
          for language in c cpp; do
            extension=c
            compiler=gcc
            standard=c11
            if [ "$language" = cpp ]; then
              extension=cpp
              compiler=g++
              standard=c++17
            fi
            base="practice/solutions/$language"
            "$compiler" -std="$standard" "$base/04-reverse-integer.$extension" -o /tmp/reverse-int
            "$compiler" -std="$standard" "$base/07-factorial.$extension" -o /tmp/factorial
            "$compiler" -std="$standard" "$base/08-fibonacci-series.$extension" -o /tmp/fibonacci-series
            "$compiler" -std="$standard" "$base/09-nth-fibonacci.$extension" -o /tmp/nth-fibonacci
            [ "$(printf '1534236469\n' | /tmp/reverse-int)" = "9646324351" ]
            [ "$(printf '20\n' | /tmp/factorial)" = "2432902008176640000" ]
            [ "$(printf '21\n' | /tmp/factorial)" = "Input too large (maximum is 20)" ]
            [ "$(printf '94\n' | /tmp/fibonacci-series)" = "Input too large (maximum is 93 terms)" ]
            [ "$(printf '92\n' | /tmp/nth-fibonacci)" = "7540113804746346429" ]
            [ "$(printf '93\n' | /tmp/nth-fibonacci)" = "Input too large (maximum index is 92)" ]
          done
          echo "Numeric boundary smoke tests passed for both languages."

      - name: Smoke-test unique common-array output (C and C++)
        shell: bash
        run: |
          set -e
          for language in c cpp; do
            extension=c
            compiler=gcc
            standard=c11
            if [ "$language" = cpp ]; then
              extension=cpp
              compiler=g++
              standard=c++17
            fi
            file="practice/solutions/$language/34-common-elements-arrays.$extension"
            "$compiler" -std="$standard" "$file" -o /tmp/common-elements
            output=$(printf '4\n1 2 2 3\n3\n2 4 2\n' | /tmp/common-elements)
            [ "$(echo "$output" | tr -s ' ' | sed 's/^ //;s/ $//')" = "2" ]
          done
          echo "Unique common-array smoke tests passed for both languages."

      - name: Run sample smoke tests for all 40 solutions
        run: python3 scripts/smoke_test_all.py
